# Render YAML — HPS Dashboard
# Un solo Web Service sirve backend API + frontend estático
# Base de datos PostgreSQL separada

services:
  # Servicio Web principal
  - type: web
    name: hps-dashboard
    env: node
    region: ohio
    plan: free
    buildCommand: |
      cd backend && npm install
      cd ../frontend && npm install && npm run build
      cp -r dist ../backend/public
    startCommand: cd backend && npm run migrate && npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DATABASE_URL
        fromDatabase:
          name: hps-db
          property: connectionString

  # Base de datos PostgreSQL
  - type: postgresql
    name: hps-db
    plan: free
    region: ohio
    ipAllowList: []
    databaseName: hps_dashboard